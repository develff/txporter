services:
  txporter:
    build: .
    container_name: txporter
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - txporter_data:/home/txporter/.aqbanking
      - ./config:/home/txporter/config
      - ./output:/home/txporter/output
    env_file: .env
    environment:
      # How long (seconds) an aqbanking-cli process may run before it is
      # considered stale and killed automatically on the next sync attempt.
      # Lower temporarily (e.g. 10) to test the auto-kill behaviour.
      - TXPORTER_STALE_PROC_TIMEOUT=300
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  txporter_data:
    name: txporter_aqbanking
